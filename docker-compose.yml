services:
  qyvoriq:
    build:
      context: .
    image: qyvoriq:local
    ports:
      - "8080:8080"
    environment:
      QYVORIQ_ENV: development
      QYVORIQ_ALLOWED_ORIGINS: http://localhost:8080
      LOG_LEVEL: INFO
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 1g
